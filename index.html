<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日韩13日行程规划器</title>
<style>body{margin:0;background:#f5f7fb;color:#1e293b;font:14px system-ui,"Microsoft Yahei",sans-serif}header{padding:26px 5%;background:linear-gradient(120deg,#0f766e,#155e75);color:white}h1{margin:0 0 5px}.wrap{max-width:1180px;margin:20px auto;padding:0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid #dbe4ee;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:#0f766e;color:#fff}.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}.day{background:#fff;border:1px solid #dbe4ee;border-radius:12px;overflow:hidden}.head{padding:12px;background:#f0fdfa;border-bottom:1px solid #dbe4ee}.head b{display:block;font-size:16px}.head small,.item small{color:#64748b}.slot{padding:10px;min-height:105px;border-bottom:1px dashed #dbe4ee}.slot:last-child{border:0}.slot.drag{background:#fff7ed}.slottitle{display:flex;justify-content:space-between;color:#64748b;font-size:12px;font-weight:600}.item{margin:7px 0;padding:8px;border:1px solid #cbd5e1;border-left:4px solid #0f766e;border-radius:8px;cursor:grab}.item.opt{border-left-color:#f59e0b;background:#fffbeb}.empty{text-align:center;color:#94a3b8;padding:12px 0;font-size:12px}@media(max-width:900px){.board{grid-template-columns:repeat(2,minmax(240px,1fr))}}@media(max-width:560px){.board{grid-template-columns:1fr}}</style></head>
<body><header><h1>日韩 13 日行程规划器</h1><div>2026/9/25–10/7 · 釜山进、仁川出 · 拖动卡片安排上午/下午/晚上</div></header><main class="wrap"><div class="toolbar"><button class="primary" id="reset">恢复基线行程</button><button id="add">新增行程卡</button><button id="export">导出 JSON</button><span id="status">自动保存到本机浏览器</span></div><section class="board" id="board"></section></main>
<script>
const base=[['9/25','周五','釜山','抵达金海机场','下午','入住、晚餐'],['9/26','周六','釜山','松岛海上缆车','上午','西部线路'],['9/26','周六','釜山','甘川文化村','下午','西部线路'],['9/26','周六','釜山','罐头市场夜市','晚上','可选'],['9/27','周日','釜山','海东龙宫寺','上午','东部线路'],['9/27','周日','釜山','海云台蓝线公园','下午','预约座位'],['9/27','周日','釜山','青沙浦海岸列车','下午','与蓝线相邻'],['9/28','周一','对马岛','釜山→比田胜','上午','国际渡船'],['9/28','周一','对马岛','比田胜港周边散步','下午','轻松游'],['9/29','周二','釜山','比田胜→釜山','上午','返程休息'],['9/30','周三','福冈','釜山→福冈航班','上午','自行选航班'],['9/30','周三','福冈','栉田神社/博多晚餐','下午','抵达后轻量安排'],['10/1','周四','福冈','太宰府天满宫','上午','半日'],['10/1','周四','福冈','福冈塔','下午','傍晚观景'],['10/2','周五','熊本','福冈→熊本','上午','九州新干线'],['10/2','周五','熊本','熊本市区散步','下午','入住后休息'],['10/3','周六','熊本','熊本城+城彩苑','上午','核心安排'],['10/3','周六','熊本','熊本广场/市中心','下午','核心安排'],['10/3','周六','熊本','阿苏中岳火山口','下午','天气允许时可选'],['10/4','周日','首尔','熊本→福冈机场→首尔','上午','建议下午航班'],['10/4','周日','首尔','弘大晚餐','晚上','自由安排'],['10/5','周一','首尔','景福宫','上午','周二闭馆'],['10/5','周一','首尔','仁寺洞','下午','同区步行'],['10/6','周二','首尔','南山公园','上午','天气好时'],['10/6','周二','首尔','自由日/弘大夜市','下午','可拖动'],['10/7','周三','首尔','前往仁川机场离境','上午','预留时间']];
const key='jk-trip-plan';let data=JSON.parse(localStorage.getItem(key)||'null')||base.map(a=>({date:a[0],weekday:a[1],city:a[2],title:a[3],slot:a[4],note:a[5]}));const days=[...new Map(data.map(x=>[x.date,{date:x.date,weekday:x.weekday}])).values()];
function save(){localStorage.setItem(key,JSON.stringify(data));document.querySelector('#status').textContent='已保存 '+new Date().toLocaleTimeString()};function render(){let b=document.querySelector('#board');b.innerHTML='';days.forEach(d=>{let c=document.createElement('article');c.className='day';c.innerHTML=`<div class="head"><b>${d.date} · ${d.weekday}</b><small>${data.find(x=>x.date==d.date)?.city||''}</small></div>`;['上午','下午','晚上'].forEach(s=>{let q=document.createElement('div');q.className='slot';q.dataset.date=d.date;q.dataset.slot=s;q.innerHTML=`<div class="slottitle"><span>${s}</span><span>拖到这里</span></div>`;let rows=data.filter(x=>x.date==d.date&&x.slot==s);if(!rows.length)q.insertAdjacentHTML('beforeend','<div class="empty">空档 · 可休息或临时安排</div>');rows.forEach(x=>{let e=document.createElement('div');e.className='item'+(x.note?.includes('可选')?' opt':'');e.draggable=true;e.dataset.id=data.indexOf(x);e.innerHTML=`<b>${x.title}</b><br><small>${x.city} · ${x.note||''}</small>`;e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',e.dataset.id);q.appendChild(e)});q.ondragover=ev=>{ev.preventDefault();q.classList.add('drag')};q.ondragleave=()=>q.classList.remove('drag');q.ondrop=ev=>{ev.preventDefault();q.classList.remove('drag');let x=data[+ev.dataTransfer.getData('text/plain')];if(x){x.date=d.date;x.slot=s;save();render()}};c.appendChild(q)});b.appendChild(c)})};
document.querySelector('#reset').onclick=()=>{if(confirm('恢复基线行程？')){data=base.map(a=>({date:a[0],weekday:a[1],city:a[2],title:a[3],slot:a[4],note:a[5]}));save();render()}};document.querySelector('#add').onclick=()=>{let t=prompt('行程名称');if(!t)return;let d=prompt('日期，例如 10/1','10/1'),s=prompt('时段：上午 / 下午 / 晚上','下午');if(!d||!['上午','下午','晚上'].includes(s))return;data.push({date:d,weekday:days.find(x=>x.date==d)?.weekday||'',city:'自定义',title:t,slot:s,note:'手动添加'});save();render()};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='japan-korea-trip-plan.json';a.click()};render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日韩13日行程规划器</title>
<style>body{margin:0;background:#f5f7fb;color:#1e293b;font:14px system-ui,"Microsoft Yahei",sans-serif}header{padding:26px 5%;background:linear-gradient(120deg,#0f766e,#155e75);color:white}h1{margin:0 0 5px}.wrap{max-width:1180px;margin:20px auto;padding:0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid #dbe4ee;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}button.primary{background:#0f766e;color:#fff}.palette{background:#fff;border:1px solid #dbe4ee;border-radius:12px;padding:13px;margin-bottom:14px}.palette-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.palette-title small{color:#64748b}.terms{display:flex;gap:8px;flex-wrap:wrap}.term{padding:7px 10px;border:1px solid #99d5cc;background:#f0fdfa;border-radius:999px;cursor:grab;font-weight:600}.term:active{cursor:grabbing}.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px}.day{background:#fff;border:1px solid #dbe4ee;border-radius:12px;overflow:hidden}.head{padding:12px;background:#f0fdfa;border-bottom:1px solid #dbe4ee}.head b{display:block;font-size:16px}.head small,.item small{color:#64748b}.slot{padding:10px;min-height:105px;border-bottom:1px dashed #dbe4ee}.slot:last-child{border:0}.slot.drag{background:#fff7ed}.slottitle{display:flex;justify-content:space-between;color:#64748b;font-size:12px;font-weight:600}.item{position:relative;margin:7px 0;padding:8px;border:1px solid #cbd5e1;border-left:4px solid #0f766e;border-radius:8px;cursor:grab}.item.opt{border-left-color:#f59e0b;background:#fffbeb}.empty{text-align:center;color:#94a3b8;padding:12px 0;font-size:12px}.trash{position:fixed;left:50%;bottom:22px;z-index:20;transform:translate(-50%,120px);opacity:0;pointer-events:none;min-width:260px;padding:16px 24px;border:2px dashed #fca5a5;border-radius:14px;background:#fff1f2;color:#b91c1c;text-align:center;font-weight:700;box-shadow:0 12px 35px #0f172a33;transition:.2s}.trash.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.trash.over{background:#fecaca;border-color:#dc2626;transform:translate(-50%,0) scale(1.05)}.undo{position:fixed;left:50%;bottom:22px;z-index:30;display:none;align-items:center;gap:14px;transform:translateX(-50%);padding:11px 14px;border-radius:10px;background:#1e293b;color:#fff;box-shadow:0 10px 30px #0f172a44}.undo.show{display:flex}.undo button{padding:5px 9px;border:0;background:#0f766e;color:#fff}@media(max-width:900px){.board{grid-template-columns:repeat(2,minmax(240px,1fr))}}@media(max-width:560px){.board{grid-template-columns:1fr}.palette-title{display:block}.trash{width:calc(100% - 28px)}}</style></head>
<style>.terms{display:block}.term-label{margin:10px 0 7px;color:#64748b;font-size:12px;font-weight:700}.term-row{display:flex;gap:8px;flex-wrap:wrap}.term.custom{border-color:#c4b5fd;background:#f5f3ff;color:#5b21b6}.item.transit{border-left-color:#2563eb;background:#eff6ff}.transit-tag{display:inline-block;margin:0 0 5px;padding:2px 6px;border-radius:999px;background:#2563eb;color:#fff;font-size:10px;font-weight:700}.item.insert-before{box-shadow:0 -4px 0 #0f766e}.item.insert-after{box-shadow:0 4px 0 #0f766e}</style>
<body><header><h1>日韩行程规划器</h1><div>2026/9/25–10/2 · 釜山进、仁川出 · 拖动卡片安排上午/下午/晚上</div></header><main class="wrap"><div class="toolbar"><button class="primary" id="reset">恢复基线行程</button><button id="add">新增自定义词条</button><button id="export">导出 JSON</button><button id="image">导出图片</button><span id="status">自动保存到本机浏览器</span></div><section class="palette"><div class="palette-title"><b>行程词条库</b><small>从词条库拖进任意时段；我的词条可拖到回收站删除</small></div><div class="terms" id="terms"></div></section><section class="board" id="board"></section></main><div class="trash" id="trash">拖到这里删除行程</div><div class="undo" id="undo"><span id="undoText"></span><button id="undoButton" type="button">撤销</button></div>
<script>
const base=[['9/25','周五','釜山','北京→金海机场→釜山酒店','上午','国际航班、抵达入住'],['9/25','周五','釜山','松岛缆车、甘川文化村','下午','视抵达时间调整'],['9/26','周六','釜山','龙宫寺、松亭、海岸列车','上午','由东向西'],['9/26','周六','釜山','青沙浦、海岸列车、尾浦、海云台','下午','沿海线路'],['9/27','周日','福冈','釜山→福冈','上午','航班转场'],['9/27','周日','福冈','栉田神社、博多','下午','抵达后游览'],['9/28','周一','福冈','太宰府','上午','半日游'],['9/28','周一','福冈','福冈塔','下午','傍晚观景'],['9/29','周二','熊本','福冈→熊本','上午','九州新干线'],['9/29','周二','熊本','熊本城、城彩苑、熊本市中心','下午','市区观光'],['9/30','周三','首尔','熊本→福冈机场→首尔','下午','跨国转场'],['10/1','周四','首尔','景福宫、仁寺洞','上午','首尔历史文化'],['10/1','周四','首尔','南山公园、弘大','下午','城市观光'],['10/2','周五','首尔','仁川机场→北京','上午','国际航班回程']];
const key='jk-trip-plan-v3';let data=JSON.parse(localStorage.getItem(key)||'null')||base.map(a=>({date:a[0],weekday:a[1],city:a[2],title:a[3],slot:a[4],note:a[5]}));const days=[...new Map(data.map(x=>[x.date,{date:x.date,weekday:x.weekday}])).values()];
const defaultTerms=['交通转场','酒店入住/退房','休息/机动','自由活动','早餐/早午餐','当地晚餐','购物','海边散步','松岛海上缆车','甘川文化村','海东龙宫寺','海云台蓝线公园','青沙浦','栉田神社','太宰府天满宫','福冈塔','熊本城','城彩苑','景福宫','仁寺洞','南山公园','弘大'];const customTermsKey='jk-custom-terms-v1';let customTerms=JSON.parse(localStorage.getItem(customTermsKey)||'[]');
function saveTerms(){localStorage.setItem(customTermsKey,JSON.stringify(customTerms))}function editCustomTerm(index){let old=customTerms[index],next=(prompt('修改自定义词条名称',old)||'').trim();if(!next||next===old)return;if(defaultTerms.includes(next)||customTerms.some((x,i)=>i!==index&&x===next)){alert('词条库中已存在“'+next+'”');return}customTerms[index]=next;saveTerms();renderTerms()}function renderTerms(){let box=document.querySelector('#terms');box.innerHTML='';function group(label,list,custom){let name=document.createElement('div'),row=document.createElement('div');name.className='term-label';name.textContent=label;row.className='term-row';list.forEach((title,index)=>{let e=document.createElement('div');e.className='term'+(custom?' custom':'');e.draggable=true;e.textContent=title;e.title=custom?'双击编辑 · 拖动使用':'拖动使用';if(custom)e.ondblclick=ev=>{ev.preventDefault();editCustomTerm(index)};e.ondragstart=ev=>{if(custom){document.querySelector('#trash').textContent='拖到这里删除自定义词条';document.querySelector('#trash').classList.add('show')}ev.dataTransfer.effectAllowed=custom?'copyMove':'copy';ev.dataTransfer.setData('application/json',JSON.stringify({kind:'term',source:custom?'custom':'system',index,title}))};e.ondragend=()=>{document.querySelector('#trash').textContent='拖到这里删除行程';hideTrash()};row.appendChild(e)});box.append(name,row)}group('常用词条',defaultTerms,false);group('我的词条（双击编辑）',customTerms,true)}
function isTransit(x){return /→|机场|航班|交通转场|新干线/.test((x.title||'')+' '+(x.note||''))}
let undoState=null,undoTimer=null;function hideTrash(){document.querySelector('#trash').classList.remove('show','over')}function showUndo(kind,item,index){undoState={kind,item,index};let box=document.querySelector('#undo'),title=kind==='term'?item:item.title;document.querySelector('#undoText').textContent='已删除“'+title+'”';box.classList.add('show');clearTimeout(undoTimer);undoTimer=setTimeout(()=>{box.classList.remove('show');undoState=null},6000)}function save(){localStorage.setItem(key,JSON.stringify(data));document.querySelector('#status').textContent='已保存 '+new Date().toLocaleTimeString()}function readPayload(ev){try{return JSON.parse(ev.dataTransfer.getData('application/json'))}catch{return null}}function placeCard(p,d,s,target,after){let item;if(p?.kind==='term')item={date:d.date,weekday:d.weekday,city:data.find(x=>x.date===d.date)?.city||'自定义',title:p.title,slot:s,note:p.source==='custom'?'我的词条':'常用词条'};else if(p?.kind==='item'&&data[p.id]){item=data[p.id];data.splice(p.id,1);item.date=d.date;item.weekday=d.weekday;item.slot=s}else return;let at;if(target){at=data.indexOf(target);if(at<0)at=data.length;else if(after)at++}else{at=data.length;for(let i=data.length-1;i>=0;i--)if(data[i].date===d.date&&data[i].slot===s){at=i+1;break}}data.splice(at,0,item);save();render()}function render(){let b=document.querySelector('#board');b.innerHTML='';days.forEach(d=>{let c=document.createElement('article');c.className='day';c.innerHTML=`<div class="head"><b>${d.date} · ${d.weekday}</b><small>${data.find(x=>x.date==d.date)?.city||''}</small></div>`;['上午','下午','晚上'].forEach(s=>{let q=document.createElement('div');q.className='slot';q.dataset.date=d.date;q.dataset.slot=s;q.innerHTML=`<div class="slottitle"><span>${s}</span><span>拖到这里</span></div>`;let rows=data.filter(x=>x.date==d.date&&x.slot==s);if(!rows.length)q.insertAdjacentHTML('beforeend','<div class="empty">空档 · 可休息或临时安排</div>');rows.forEach(x=>{let e=document.createElement('div'),id=data.indexOf(x);e.className='item'+(x.note?.includes('可选')?' opt':'');e.draggable=true;e.dataset.id=id;e.innerHTML=`<b>${x.title}</b><br><small>${x.city} · ${x.note||''}</small>`;e.ondragstart=ev=>{document.querySelector('#trash').textContent='拖到这里删除行程';document.querySelector('#trash').classList.add('show');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('application/json',JSON.stringify({kind:'item',id:+e.dataset.id}))};e.ondragend=()=>{hideTrash();e.classList.remove('insert-before','insert-after')};e.ondragover=ev=>{ev.preventDefault();ev.stopPropagation();let after=ev.clientY>e.getBoundingClientRect().top+e.offsetHeight/2;e.classList.toggle('insert-before',!after);e.classList.toggle('insert-after',after)};e.ondragleave=()=>e.classList.remove('insert-before','insert-after');e.ondrop=ev=>{ev.preventDefault();ev.stopPropagation();let after=ev.clientY>e.getBoundingClientRect().top+e.offsetHeight/2;hideTrash();placeCard(readPayload(ev),d,s,x,after)};q.appendChild(e)});q.ondragover=ev=>{ev.preventDefault();q.classList.add('drag')};q.ondragleave=()=>q.classList.remove('drag');q.ondrop=ev=>{ev.preventDefault();hideTrash();q.classList.remove('drag');placeCard(readPayload(ev),d,s,null,true)};c.appendChild(q)});b.appendChild(c)})};
function exportImage(){let scale=2,w=1200,allDays=[...new Map(base.map(a=>[a[0],{date:a[0],weekday:a[1]}])).values()],h=120+allDays.length*210,c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;let x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#f5f7fb';x.fillRect(0,0,w,h);x.fillStyle='#155e75';x.fillRect(0,0,w,78);x.fillStyle='#fff';x.font='bold 27px Arial,"Microsoft Yahei"';x.fillText('日韩行程规划器',28,36);x.font='14px Arial,"Microsoft Yahei"';x.fillText('2026/9/25–10/2 · 釜山进、仁川出',28,60);let y=94;allDays.forEach(d=>{x.fillStyle='#fff';x.fillRect(18,y,w-36,188);x.strokeStyle='#dbe4ee';x.strokeRect(18,y,w-36,188);x.fillStyle='#0f766e';x.font='bold 16px Arial,"Microsoft Yahei"';x.fillText(d.date+' · '+d.weekday+' · '+(data.find(q=>q.date===d.date)?.city||''),32,y+24);['上午','下午','晚上'].forEach((s,i)=>{let sy=y+34+i*50;x.fillStyle='#64748b';x.font='bold 12px Arial,"Microsoft Yahei"';x.fillText(s,32,sy+16);let rows=data.filter(q=>q.date===d.date&&q.slot===s);rows.forEach((q,j)=>{let xx=100+j*350;x.fillStyle=q.note?.includes('可选')?'#fff3c4':'#e5f8f5';x.fillRect(xx,sy,330,37);x.fillStyle='#1e293b';x.font='bold 12px Arial,"Microsoft Yahei"';x.fillText((q.title||'').slice(0,24),xx+8,sy+16);x.fillStyle='#64748b';x.font='11px Arial,"Microsoft Yahei"';x.fillText((q.note||'').slice(0,30),xx+8,sy+31)})});y+=210});let a=document.createElement('a');a.download='japan-korea-trip-plan.png';a.href=c.toDataURL('image/png');a.click()}
let trash=document.querySelector('#trash');trash.ondragover=ev=>{ev.preventDefault();trash.classList.add('over');ev.dataTransfer.dropEffect='move'};trash.ondragleave=()=>trash.classList.remove('over');trash.ondrop=ev=>{ev.preventDefault();let p;try{p=JSON.parse(ev.dataTransfer.getData('application/json'))}catch{}hideTrash();if(p?.kind==='item'&&data[p.id]){let item=data.splice(p.id,1)[0];save();render();showUndo('item',item,p.id)}else if(p?.kind==='term'&&p.source==='custom'&&customTerms[p.index]===p.title){let term=customTerms.splice(p.index,1)[0];saveTerms();renderTerms();showUndo('term',term,p.index)}};document.querySelector('#undoButton').onclick=()=>{if(!undoState)return;if(undoState.kind==='term'){customTerms.splice(Math.min(undoState.index,customTerms.length),0,undoState.item);saveTerms();renderTerms()}else{data.splice(Math.min(undoState.index,data.length),0,undoState.item);save();render()}undoState=null;clearTimeout(undoTimer);document.querySelector('#undo').classList.remove('show')};document.querySelector('#reset').onclick=()=>{if(confirm('恢复基线行程？')){data=base.map(a=>({date:a[0],weekday:a[1],city:a[2],title:a[3],slot:a[4],note:a[5]}));save();render()}};document.querySelector('#add').onclick=()=>{let t=(prompt('自定义词条名称')||'').trim();if(!t)return;if(defaultTerms.includes(t)||customTerms.includes(t)){alert('词条库中已存在“'+t+'”');return}customTerms.push(t);saveTerms();renderTerms()};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='japan-korea-trip-plan.json';a.click()};document.querySelector('#image').onclick=exportImage;renderTerms();render();
</script><script>
function decorateTransit(){document.querySelectorAll('.item').forEach(e=>{let item=data[+e.dataset.id];if(isTransit(item)&&!e.classList.contains('transit')){e.classList.add('transit');e.insertAdjacentHTML('afterbegin','<span class="transit-tag">转机 / 转场</span><br>')}})}
decorateTransit();new MutationObserver(decorateTransit).observe(document.querySelector('#board'),{childList:true,subtree:true});
function exportImageWithTransit(){
  let scale=2,w=1200,allDays=[...new Map(base.map(a=>[a[0],{date:a[0],weekday:a[1]}])).values()],h=120+allDays.length*210,c=document.createElement('canvas');
  c.width=w*scale;c.height=h*scale;let x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#f5f7fb';x.fillRect(0,0,w,h);x.fillStyle='#155e75';x.fillRect(0,0,w,78);x.fillStyle='#fff';x.font='bold 27px Arial,"Microsoft Yahei"';x.fillText('日韩行程规划器',28,36);x.font='14px Arial,"Microsoft Yahei"';x.fillText('北京出发/返回 · 2026/9/25–10/2',28,60);
  let y=94;allDays.forEach(d=>{x.fillStyle='#fff';x.fillRect(18,y,w-36,188);x.strokeStyle='#dbe4ee';x.strokeRect(18,y,w-36,188);x.fillStyle='#0f766e';x.font='bold 16px Arial,"Microsoft Yahei"';x.fillText(d.date+' · '+d.weekday+' · '+(data.find(q=>q.date===d.date)?.city||''),32,y+24);['上午','下午','晚上'].forEach((s,i)=>{let sy=y+34+i*50;x.fillStyle='#64748b';x.font='bold 12px Arial,"Microsoft Yahei"';x.fillText(s,32,sy+16);data.filter(q=>q.date===d.date&&q.slot===s).forEach((q,j)=>{let xx=100+j*350,transit=isTransit(q);x.fillStyle=transit?'#dbeafe':q.note?.includes('可选')?'#fff3c4':'#e5f8f5';x.fillRect(xx,sy,330,37);if(transit){x.fillStyle='#2563eb';x.fillRect(xx,sy,5,37)}x.fillStyle='#1e293b';x.font='bold 12px Arial,"Microsoft Yahei"';x.fillText((transit?'[转机/转场] ':'')+(q.title||'').slice(0,20),xx+10,sy+16);x.fillStyle='#64748b';x.font='11px Arial,"Microsoft Yahei"';x.fillText((q.note||'').slice(0,30),xx+10,sy+31)});});y+=210});let a=document.createElement('a');a.download='japan-korea-trip-plan.png';a.href=c.toDataURL('image/png');a.click();
}
document.querySelector('#image').onclick=exportImageWithTransit;
</script></body></html>
